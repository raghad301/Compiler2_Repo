<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Edit Product</title>
<link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body data-page="edit"><main class="container narrow"><a class="back-link" href="index.html">Back to Products</a><h1>Edit Product</h1>
<form id="product-form" method="post" enctype="multipart/form-data" data-product-id=""><div class="form-field"><label for="name">Product Name</label><input id="name" name="name" type="text" value="" required></div>
<div class="form-field"><label for="price">Price</label><input id="price" name="price" type="number" min="0" step="0.01" value="" required></div>
<div class="form-field"><label for="image">Replace Product Image</label><input id="image" name="image" type="file" accept=".png,.jpg,.jpeg,.webp"><small class="muted">Current image: </small></div>
<div class="form-actions"><button type="submit">Update Product</button><a class="button secondary" href="index.html">Cancel</a></div>
</form>
</main>
</body>
</html>
